# Deploy the static site to GitHub Pages.
#
# As of the mythology redesign, this site is one hand-written
# index.html plus an images/ folder — no manifest generation, no
# prerendering, no content pipeline. The deploy step is just "copy
# the files GitHub Pages needs into dist/ and upload it."
#
# One-time setup on GitHub
#   Settings → Pages → Build and deployment → Source = "GitHub Actions".
#   (NOT "Deploy from a branch".)

name: deploy to pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stage only what the site needs into a clean dist/, so stray
      # repo files (scripts, source images, docs) never get published.
      - name: assemble dist/
        run: |
          set -eu
          mkdir -p dist
          cp index.html sitemap.xml robots.txt resume.pdf llms.txt .nojekyll dist/
          cp -r images certs dist/
          mkdir -p dist/content/blog
          cp -r content/blog/*.md dist/content/blog/ 2>/dev/null || true
          cp -r content/blog/notes dist/content/blog/ 2>/dev/null || true

      - name: package site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
